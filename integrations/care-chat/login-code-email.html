<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FC 暖心聊聊 · 登录验证码</title></head>
<body style="margin:0;padding:28px 16px;background:#f7f4ea;font-family:Arial,'Microsoft YaHei',sans-serif;color:#254d43">
<table role="presentation" style="width:100%;max-width:540px;margin:auto;border-collapse:separate;border-spacing:0;background:#fffdf7;border:1px solid #e1e5d9;border-radius:24px"><tr><td style="padding:34px 28px">
<p style="font-size:11px;letter-spacing:2px;color:#8b7758;margin:0 0 20px">A LITTLE SPACE. A LISTENING EAR.</p>
<h1 style="font-size:28px;font-weight:500;margin:0 0 8px">FC 暖心聊聊</h1>
<p style="font-size:14px;margin:0 0 28px">FC Care Chat</p>
<p style="line-height:1.8;margin:0 0 18px">你的登录验证码<br><span lang="en">Your sign-in code</span></p>
<p style="padding:22px 12px;text-align:center;background:#e9f0e6;border-radius:16px;font-size:32px;font-weight:bold;letter-spacing:7px;margin:0 0 22px">{{ .Token }}</p>
<p style="font-size:14px;line-height:1.8">回到聊天页面，输入以上验证码即可继续。<br><span lang="en">Return to the chat page and enter this code to continue.</span></p>
<p style="font-size:12px;line-height:1.8;color:#687a6b;margin-top:28px">请勿将验证码交给他人。若非你本人请求，请忽略此邮件。<br><span lang="en">Keep this code private. If you did not request it, ignore this email.</span></p>
</td></tr></table>
</body></html>
