 en:{eyebrow:'YOUR EXPERIENCE. A LITTLE THANK YOU.',title:'Share your experience. Earn free days with renewal.',lead:'Your own honest experience matters more than polished words.',one:'Each verified testimonial',day:'1 free day',cap:'Per annual membership term',fifteen:'Up to 15 days',renew:'After paid renewal',redeem:'Verify & redeem',track:'Audio for this share',share:'Share my experience of this audio',claim:'I have shared — request verification ↗',terms:'Read the full rules',language:'中文',guide:'You may describe the version, listening context and your actual experience, including no noticeable change. More comments do not automatically mean more reward days.',privacy:'Comments are visible according to FC’s existing discussion settings. Share only what you are comfortable disclosing. Medical records, identity documents and another person’s private details are not required.',manual:'FC checks the original comment, member identity, annual membership term and duplicate claims before confirming days. Staff review and fulfil rewards; this page does not extend membership or change billing automatically.',whatsapp:'The request opens WhatsApp with this audio title and page link only. Your comment is not read or copied; you choose whether to send the message.',compose:'The discussion for this audio is open. Write your honest experience in FC’s existing input, then choose Share yourself.',unavailable:'The discussion input is not available here. Open Discuss in the sidebar, or contact FC for help.',step1:'01 · Share under this audio',step2:'02 · Request staff verification',step3:'03 · Redeem with paid renewal',rulesTitle:'Testimonial Sharing Reward · Rules',rules:[['Who can collect?','This reward applies to an annual membership term verified by FC. Each genuine, original, verified listening testimonial earns 1 free day, up to 15 days across all audios and versions in the same annual membership term. The limit is per membership term, not calendar year. Other plans are not automatically covered.'],['How do I share?','Sign in with your existing FC account and share under the relevant audio’s Discuss tab. Positive, neutral and no-noticeable-change experiences may be shared honestly. A positive review, five-star rating, improvement evidence or minimum listening duration is not required.'],['How is it verified?','Contact FC after sharing. Staff check the account, original comment and date, annual membership term and duplicate claims. The same testimonial cannot earn twice. Copying, paraphrasing or reposting does not automatically earn rewards. Multiple same-day shares need individual review, not automatic bulk approval.'],['When can I redeem?','Verified shares are recorded first. After paid renewal, FC checks the renewal order, approved days and actual expiry date, then records fulfilment. Approval is not proof that membership has already been extended. The final FC fulfilment record and membership-system dates apply.'],['Can I keep commenting?','Yes. You may continue sharing after reaching 15 days; the same annual membership term earns no additional days. Redemption is checked against the original term and cannot be claimed twice for that period.'],['Publicity consent and other rewards','This programme concerns genuine FC-site experience sharing, not paid positive reviews on Google, Facebook or other platforms. FC will separately request permission for public promotional reuse; that choice does not affect verification. Check-in rewards are recorded separately. This page does not combine them or promise a total bonus.'],['What if a record is wrong?','Contact FC with the original comment link, or a date and audio title staff can check. A full health report is not required.']],back:'Return to FC member home',how:'Share by audio · Keep your FC account · Staff verify before renewal redemption',preview:'Design preview: example audio. No comment is posted and no reward is granted.'}

ward .fctr-status{padding:12px 16px;border-radius:12px;background:#e6eee0}.fc-testimonial-reward details{margin-top:18px;border-top:1px solid #e2d9c4;padding-top:16px}.fc-testimonial-reward summary{cursor:pointer;font-weight:bold}.fc-testimonial-reward h3{font-size:18px;line-height:1.5;margin:24px 0 8px}.fc-testimonial-reward a:focus-visible,.fc-testimonial-reward button:focus-visible,.fc-testimonial-reward summary:focus-visible{outline:3px solid #ad8b40;outline-offset:4px}#fc-testimonial-page{max-width:1050px;margin:35px auto;padding:0 18px}.fc-testimonial-reward .fctr-preview{border:1px dashed #b9a675;padding:12px;border-radius:12px}.fc-testimonial-reward .fctr-brand{font-size:12px;font-weight:700;letter-spacing:2px}@media(max-width:540px){.fc-testimonial-reward .fctr-stats{gap:7px}.fc-testimonial-reward .fctr-stat{padding:12px 9px}.fc-testimonial-reward .fctr-stat strong{font-size:18px}.fc-testimonial-reward .fctr-stat span{font-size:11px}.fc-testimonial-reward .fctr-actions>*{width:100%}}`;

 root.append(el('p','fctr-small',c.manual));if(page&&!preview){root.append(rules(c));const back=el('a','fctr-action',c.back);back.href=FC_HOME;root.append(back);}else{const d=el('details');d.append(el('summary','',c.terms),rules(c));root.append(d);}if(preview)root.append(el('p','fctr-preview',c.preview));root.append(el('p','fctr-small','FC-TESTIMONIAL-2026-10-v1'));}
 function refresh(){if(page){if(root)return;root=el('section','fc-testimonial-reward');root.id='fc-testimonial-reward';page.append(root);render(preview?{z:'放松',n:'Relax',c:'sound-healing',u:'preview'}:null);return;}const r=context(location.href);if(!r){root?.remove();root=null;current='';return;}const frame=document.getElementById('playerFrame');if(!frame)return;const key=r.c+'/'+r.u;if(root?.isConnected&&key===current)return;root?.remove();root=el('section','fc-testimonial-reward');root.id='fc-testimonial-reward';root.setAttribute('aria-label','FC 见证分享奖励 · Testimonial Sharing Reward');frame.after(root);current=key;render(r);}
