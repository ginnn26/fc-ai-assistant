<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FC 暖心聊聊</title><link rel="stylesheet" href="/care-chat.css"><script src="/theme-media.js" defer></script><script src="/care-chat-login.js" defer></script><script src="/care-chat-voice.js" defer></script><script src="/care-chat.js" defer></script></head>
<body><main><header><a href="https://frequencies-clinic.learnworlds.com/start" target="_top">← FC</a><button id="sign-out" type="button" hidden></button><button id="language" type="button">English</button></header><section class="welcome"><span class="spark" aria-hidden="true">✦</span><p class="eyebrow">A LITTLE SPACE. A LISTENING EAR.</p><h1 id="title">FC 暖心聊聊</h1><p id="intro">不用急着说清楚。从今天的感受开始，一起聊一聊。</p></section>
<section id="login-panel" class="conversation" hidden aria-labelledby="login-title"><h2 id="login-title"></h2><p id="login-copy" class="small"></p><form id="login-form"><label id="email-label" for="login-email"></label><input id="login-email" type="email" autocomplete="email" maxlength="254" required><button id="send-code" type="button"></button><label id="code-label" for="login-code"></label><input id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required><label class="consent"><input id="remember-login" type="checkbox"><span id="remember-label"></span></label><button id="verify-code" type="submit"></button><p id="login-status" role="status"></p></form></section>
<section class="conversation" aria-label="Conversation"><p id="allowance" role="status">正在准备聊天…</p><button id="refresh-allowance" type="button" hidden></button><p id="allowance-status" class="small" role="status"></p><p id="allowance-tip" class="small" role="status" hidden></p><section id="starters" class="starters" hidden aria-labelledby="starter-title"><h2 id="starter-title"></h2><div class="starter-cards"><button id="choose-tired" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.7 8.7 0 019.8 3.5a8.8 8.8 0 1010.7 10.7Z"/></svg><span id="starter-tired"></span></button><button id="choose-tense" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C12 4 5 6 5 13a6 6 0 006 6c7 0 9-7 9-15Z"/><path d="M3 21 15 9"/></svg><span id="starter-tense"></span></button><button id="choose-talk" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 00-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 000-7.8Z"/></svg><span id="starter-talk"></span></button></div><p id="starter-hint" class="small"></p></section><ol id="messages" aria-live="polite" aria-relevant="additions"></ol><form id="chat-form"><label for="message" id="message-label">今天的你，感觉怎么样？</label><textarea id="message" rows="3" maxlength="1200" disabled></textarea><section id="voice-panel" class="voice-panel" hidden aria-labelledby="voice-title"><h2 id="voice-title"></h2><p id="voice-hint" class="small"></p><div class="voice-stage"><div id="voice-wave" class="voice-wave" aria-hidden="true"><span id="voice-bar-0"></span><span id="voice-bar-1"></span><span id="voice-bar-2"></span><span id="voice-bar-3"></span><span id="voice-bar-4"></span><span id="voice-bar-5"></span><span id="voice-bar-6"></span><span id="voice-bar-7"></span><span id="voice-bar-8"></span><span id="voice-bar-9"></span><span id="voice-bar-10"></span><span id="voice-bar-11"></span><span id="voice-bar-12"></span><span id="voice-bar-13"></span><span id="voice-bar-14"></span><span id="voice-bar-15"></span><span id="voice-bar-16"></span><span id="voice-bar-17"></span><span id="voice-bar-18"></span><span id="voice-bar-19"></span><span id="voice-bar-20"></span><span id="voice-bar-21"></span><span id="voice-bar-22"></span><span id="voice-bar-23"></span><span id="voice-bar-24"></span><span id="voice-bar-25"></span><span id="voice-bar-26"></span><span id="voice-bar-27"></span><span id="voice-bar-28"></span><span id="voice-bar-29"></span><span id="voice-bar-30"></span><span id="voice-bar-31"></span><span id="voice-bar-32"></span></div><button id="record-voice" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0014 0v-2M12 19v3M8 22h8"/></svg><span id="record-voice-label"></span></button></div><audio id="voice-preview" controls hidden></audio><div class="voice-actions"><button id="convert-voice" type="button" hidden></button><button id="discard-voice" type="button" hidden></button></div><p id="voice-status" role="status"></p><p id="voice-cost" class="small"></p></section><label class="consent"><input id="consent" type="checkbox"><span id="consent-copy">我同意将本次聊天文字交由 OpenAI 处理。不包含姓名、电话等个人资料。</span></label><div class="actions"><button id="clear" type="button">清空聊天</button><button id="send" type="submit" disabled>发送 ↗</button></div><p id="error" role="status"></p></form><aside id="extra-panel" class="extra-panel" hidden><span aria-hidden="true">✦</span><h2 id="extra-title"></h2><p id="extra-copy"></p></aside><p id="boundary" class="small">提供日常身心支持，不作诊断或医疗建议。紧急不适请先就医。</p></section></main></body></html>
