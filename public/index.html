<body>

<div class="assistant-container">

  <div class="header">
    <h2>✨ FC AI Assistant</h2>
    <p>Your wellness support assistant</p>
  </div>

  <div id="chatBox">
    <div class="message assistant-message">
      <div class="bubble">
        Hello! I'm the FC AI Assistant. How can I help you today?
      </div>
    </div>
  </div>

  <div class="input-area">

    <input
            type="text"
            id="messageInput"
            placeholder="Ask FC AI Assistant..."
    >

    <button id="micButton" type="button">
      🎙️
    </button>

    <button id="sendButton" type="button">
      Send
    </button>

  </div>

</div>

<script>

  const chatBox = document.getElementById("chatBox");
  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const micButton = document.getElementById("micButton");

  let mediaRecorder;
  let audioChunks = [];
  micButton.addEventListener("click", async function () {

    if (!mediaRecorder || mediaRecorder.state === "inactive") {

      try {

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function (event) {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async function () {

          const audioBlob = new Blob(audioChunks, {
            type: "audio/webm"
          });

          console.log("Recording completed.");
          console.log("Audio size:", audioBlob.size, "bytes");

          // Stop microphone
          stream.getTracks().forEach(track => track.stop());

          try {

            const formData = new FormData();

            formData.append(
                    "audio",
                    audioBlob,
                    "recording.webm"
            );

            console.log("Uploading audio for transcription...");

            const response = await fetch("/chat/transcribe", {
              method: "POST",
              body: formData
            });

            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.error || "Transcription failed");
            }

            console.log("Transcript:", data.transcript);

// Put transcript into input
            messageInput.value = data.transcript;

// Automatically send transcript to AI
            await sendMessage();

          } catch (error) {

            console.error("Transcription error:", error);

            alert("Failed to transcribe audio.");

          }

        };

        mediaRecorder.start();

        micButton.textContent = "⏹️";
        micButton.classList.add("recording");

        console.log("Recording started.");

      } catch (error) {

        console.error("Microphone error:", error);

        alert("Microphone permission is required to record audio.");
      }

    } else {

      mediaRecorder.stop();

      micButton.textContent = "🎙️";
      micButton.classList.remove("recording");

      console.log("Recording stopped.");
    }

  });

  async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) {
      return;
    }

    // Show user message
    chatBox.innerHTML += `
        <div class="message user-message">
          <div class="bubble">
            ${message}
          </div>
        </div>
      `;

    messageInput.value = "";
    sendButton.disabled = true;

    // Show loading message
    const loadingMessage = document.createElement("div");

    loadingMessage.className = "message assistant-message";
    loadingMessage.innerHTML = `
        <div class="bubble loading">
          FC AI is thinking...
        </div>
      `;

    chatBox.appendChild(loadingMessage);

    chatBox.scrollTop = chatBox.scrollHeight;

    try {

      const response = await fetch("/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      loadingMessage.remove();

      chatBox.innerHTML += `
          <div class="message assistant-message">
            <div class="bubble">
              ${data.reply || "Sorry, I couldn't generate a response."}
            </div>
          </div>
        `;

    } catch (error) {

      console.error(error);

      loadingMessage.remove();

      chatBox.innerHTML += `
          <div class="message assistant-message">
            <div class="bubble">
              Sorry, there was an error connecting to FC AI.
            </div>
          </div>
        `;
    }

    sendButton.disabled = false;

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  sendButton.addEventListener("click", sendMessage);

  messageInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  });

</script>

</body>
</html>
