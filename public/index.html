<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FC AI Assistant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    #chatBox {
      border: 1px solid #ddd;
      min-height: 300px;
      padding: 15px;
      margin-bottom: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
    }

    .user {
      font-weight: bold;
    }

    .assistant {
      color: #333;
    }

    #messageInput {
      width: 75%;
      padding: 10px;
    }

    #sendButton {
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>FC AI Assistant</h2>

  <div id="chatBox"></div>

  <input
    type="text"
    id="messageInput"
    placeholder="Ask FC AI Assistant..."
  >

  <button id="sendButton">
    Send
  </button>

  <script>

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    async function sendMessage() {

      const message = messageInput.value.trim();

      if (!message) {
        return;
      }

      // Show user message
      chatBox.innerHTML += `
        <div class="message">
          <span class="user">You:</span>
          ${message}
        </div>
      `;

      messageInput.value = "";

      try {

        const response = await fetch("/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        chatBox.innerHTML += `
          <div class="message">
            <span class="assistant">FC AI:</span>
            ${data.reply}
          </div>
        `;

      } catch (error) {

        console.error(error);

        chatBox.innerHTML += `
          <div class="message">
            Error connecting to FC AI.
          </div>
        `;
      }

    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
