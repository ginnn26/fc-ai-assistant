<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow" />
    <title>FC 暖心聊聊</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #244b3e;
        --muted: #65756b;
        --paper: #f7f4ec;
        --sage: #e4eadf;
        --line: #d9dfd5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.8 Arial,
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      textarea,
      select,
      input {
        font: inherit;
      }
      button,
      a,
      select,
      input {
        touch-action: manipulation;
      }
      button,
      a {
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #b29262;
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      .shell {
        max-width: 1120px;
        margin: auto;
        padding: 24px clamp(18px, 4vw, 56px) 60px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }
      a {
        color: inherit;
      }
      .brand {
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 10px;
        letter-spacing: 2px;
        line-height: 1.4;
      }
      .mark {
        font:
          italic 38px Georgia,
          serif;
        letter-spacing: -5px;
        border: 1px solid #aab8a7;
        border-radius: 50%;
        padding: 4px 16px 9px 8px;
      }
      .quiet,
      button.secondary {
        border: 1px solid var(--line);
        border-radius: 30px;
        background: transparent;
        color: var(--ink);
        padding: 9px 20px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1fr 230px;
        align-items: center;
        gap: 30px;
        padding: 50px 0 34px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2.5px;
        color: var(--muted);
        margin: 0 0 18px;
      }
      h1 {
        font:
          normal clamp(36px, 5.5vw, 62px)/1.3 Georgia,
          "Songti SC",
          serif;
        letter-spacing: -1px;
        margin: 0 0 24px;
      }
      h2 {
        font:
          normal 30px/1.4 Georgia,
          "Songti SC",
          serif;
        margin: 10px 0 16px;
      }
      h3 {
        font-size: 20px;
        line-height: 1.5;
        margin: 0 0 7px;
      }
      .lede {
        max-width: 650px;
        color: var(--muted);
        margin: 0;
      }
      .sound-art {
        height: 230px;
        position: relative;
        border-radius: 120px 120px 25px 25px;
        overflow: hidden;
        background: linear-gradient(145deg, #254c3e, #8d9b76);
        display: grid;
        place-items: center;
      }
      .sound-art:before,
      .sound-art:after {
        content: "";
        position: absolute;
        border: 1px solid #e6e2bd66;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        transform: translateY(65px);
        box-shadow:
          0 0 0 20px #e6e2bd22,
          0 0 0 40px #e6e2bd22,
          0 0 0 60px #e6e2bd22;
      }
      .sound-art span {
        font: italic 27px Georgia;
        color: #f7f4ec;
        z-index: 1;
        text-align: center;
        line-height: 1.4;
      }
      .steps {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 28px;
      }
      .steps span {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .steps b {
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 50%;
        padding: 2px 8px;
      }
      .panel {
        padding: clamp(20px, 4vw, 36px);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #fffefa;
        margin-bottom: 20px;
      }
      .consent {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        font-size: 14px;
        color: var(--muted);
      }
      input[type="checkbox"] {
        margin-top: 7px;
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        accent-color: var(--ink);
      }
      .record-row {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        margin: 25px 0 18px;
      }
      .primary {
        border: 0;
        background: var(--ink);
        color: #fffefa;
        padding: 14px 24px;
        border-radius: 30px;
        min-height: 50px;
      }
      .recording {
        background: #9f5145 !important;
      }
      .status {
        color: var(--muted);
        font-size: 14px;
        min-height: 28px;
      }
      .status.error {
        color: #9f5145;
      }
      .small {
        font-size: 13px;
        color: var(--muted);
      }
      .upload-label {
        display: inline-block;
        text-decoration: underline;
        cursor: pointer;
        font-size: 14px;
      }
      input[type="file"] {
        max-width: 100%;
        font-size: 13px;
        margin: 6px 0 16px;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 12px;
        color: var(--muted);
        margin: 28px 0 14px;
      }
      .divider:after {
        content: "";
        height: 1px;
        background: var(--line);
        flex: 1;
      }
      textarea {
        width: 100%;
        resize: vertical;
        min-height: 140px;
        padding: 16px;
        border: 1px solid #b6c5b5;
        border-radius: 12px;
        color: var(--ink);
        background: #fff;
        line-height: 1.8;
      }
      .form-bottom {
        display: flex;
        gap: 14px;
        align-items: end;
        flex-wrap: wrap;
        margin-top: 17px;
      }
      .form-bottom label {
        flex: 1;
        min-width: 200px;
        font-size: 13px;
      }
      select {
        display: block;
        width: 100%;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--ink);
        background: #fff;
        margin-top: 6px;
      }
      .count {
        text-align: right;
        font-size: 12px;
        color: var(--muted);
      }
      .help {
        padding: 15px;
        background: #eef1e8;
        border-radius: 12px;
        margin: 15px 0;
      }
      .result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .result-card {
        padding: 24px 0;
        border-top: 1px solid var(--line);
      }
      .result-card p {
        margin: 8px 0;
      }
      .subtitle {
        color: var(--muted);
        font-size: 14px;
      }
      .version {
        display: block;
        margin: 10px 0;
        padding: 13px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        text-decoration: none;
        background: #f4f6ee;
      }
      .links {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        font-size: 14px;
      }
      summary {
        cursor: pointer;
      }
      footer {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        padding-top: 28px;
      }
      .notice {
        padding: 18px;
        background: #edf1e7;
        border-radius: 12px;
      }
      .preview {
        color: #8c633b;
        font-size: 12px;
      }
      @media (max-width: 650px) {
        .hero {
          grid-template-columns: 1fr;
          padding-top: 35px;
        }
        .sound-art {
          display: none;
        }
        .steps {
          gap: 10px;
          font-size: 12px;
        }
        .panel {
          border-radius: 16px;
        }
        .form-bottom > button {
          width: 100%;
        }
        .result-head {
          align-items: flex-start;
        }
        .shell {
          padding-top: 18px;
        }
        .brand {
          font-size: 9px;
          gap: 10px;
        }
        .quiet {
          padding: 8px 15px;
        }
      }
    </style>
    <link rel="stylesheet" href="/listening-visuals.css" />
    <link rel="stylesheet" href="/voice-ui.css" />
    <link rel="stylesheet" href="/companion-design.css" />
    <script src="/theme-media.js" defer></script>
    <script src="/listening-visuals.js" defer></script>
    <script src="/voice-ui.js" defer></script>
    <script src="/assistant.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <a
          class="home-link"
          href="https://frequencies-clinic.learnworlds.com/pages/home"
          target="_top"
          >← 首页 / Home</a
        ><button id="language" class="quiet" type="button">English</button>
      </header>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">YOUR VOICE. YOUR STARTING POINT.</p>
          <h1 id="title"></h1>
          <p id="intro" class="lede"></p>
        </div>
        <figure class="welcome-scene">
          <img src="/assistant-welcome.webp" alt="" width="840" height="1050" fetchpriority="high" />
          <figcaption>A little space.<br /><em>A listening ear.</em></figcaption>
          <span class="scene-caption" id="scene-caption"></span>
        </figure>
      </section>
      <div id="steps" class="steps"></div>
      <section class="panel" aria-labelledby="share-title">
        <h2 id="share-title"></h2>
        <div class="voice-layout">
        <aside class="speaking-guide" aria-labelledby="guide-title">
          <p class="eyebrow" id="guide-title"></p>
          <div class="guide-item"><span class="guide-icon mood" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 5.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/></svg></span><div><h3 id="guide-feel"></h3><p id="guide-feel-copy"></p></div></div>
          <div class="guide-item"><span class="guide-icon time" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><h3 id="guide-time"></h3><p id="guide-time-copy"></p></div></div>
          <div class="guide-item"><span class="guide-icon care" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="15" rx="3"/><path d="M9 6V3h6v3M12 10v7M8.5 13.5h7"/></svg></span><div><h3 id="guide-care"></h3><p id="guide-care-copy"></p></div></div>
          <p class="guide-foot" id="guide-foot"></p>
        </aside>
        <div class="voice-workspace">
        <p class="voice-invite" id="voice-invite"></p>
        <label class="consent"
          ><input id="consent" type="checkbox" /><span id="consent-short"></span
        ></label>
        <details class="privacy-details"><summary id="privacy-label"></summary><p id="consent-copy"></p></details>
        <div class="record-row">
          <div class="voice-stage">
            <span class="voice-halo one" aria-hidden="true"></span>
            <span class="voice-halo two" aria-hidden="true"></span>
            <span class="voice-halo three" aria-hidden="true"></span>
            <span class="voice-spark a" aria-hidden="true"></span>
            <span class="voice-spark b" aria-hidden="true"></span>
            <span class="voice-spark c" aria-hidden="true"></span>
          <button
            id="micButton"
            class="primary"
            type="button"
            aria-pressed="false"
          ><svg class="voice-microphone" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false"><rect x="11" y="3" width="10" height="17" rx="5" stroke="currentColor" stroke-width="1.8"/><path d="M7 15v2a9 9 0 0 0 18 0v-2M16 26v4M11 30h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><svg class="voice-stop" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="7" y="7" width="18" height="18" rx="5" fill="currentColor"/></svg><span data-mic-label>开始说话</span></button>
          </div>
          <div class="voice-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <span id="record-note" class="small"></span>
          <button
            id="cancel-recording"
            class="secondary"
            type="button"
            hidden
          >取消录音</button>
        </div>
        </div>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="mic-help" class="help" hidden>
          <p id="mic-help-copy"></p>
          <a id="open-direct" target="_blank" rel="noopener"></a>
        </div>
        <details>
          <summary id="upload-label"></summary>
          <p id="upload-copy" class="small"></p>
          <input
            id="audio-file"
            type="file"
            accept="audio/*,.webm,.m4a,.mp4,.mp3,.ogg,.wav,.flac"
          /><button id="upload-button" type="button" class="secondary"></button>
        </details>
        <div id="review-label" class="divider"></div>
        <form id="messageForm">
          <label id="input-label" for="messageInput"></label
          ><textarea id="messageInput" maxlength="2000" rows="4"></textarea>
          <div id="count" class="count">0 / 2000</div>
          <div class="form-bottom">
            <label
              ><span id="preference-label"></span
              ><select id="preference"></select></label
            ><button id="sendButton" class="primary" type="submit"></button>
          </div>
        </form>
        <p id="boundary" class="small"></p>
      </section>
      <section
        id="results"
        class="panel"
        hidden
        aria-labelledby="results-title"
      >
        <p class="eyebrow">YOUR FC LISTENING COMPANIONS</p>
        <div class="result-head">
          <h2 id="results-title" tabindex="-1"></h2>
          <button id="reset" class="quiet" type="button"></button>
        </div>
        <p id="results-message" class="notice"></p>
        <div id="membership-row">
          <label for="membership" id="membership-label"></label
          ><select id="membership"></select>
          <p id="access-note" class="small"></p>
        </div>
        <div id="recommendations"></div>
        <p id="results-boundary" class="small"></p>
      </section>
      <footer id="footer"></footer>
    </main>
  </body>
</html>
