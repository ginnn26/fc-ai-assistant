<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow" />
    <title>FC · 说说此刻的你</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #244b3e;
        --muted: #65756b;
        --paper: #f7f4ec;
        --sage: #e4eadf;
        --line: #d9dfd5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.8 Arial,
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      textarea,
      select,
      input {
        font: inherit;
      }
      button,
      a,
      select,
      input {
        touch-action: manipulation;
      }
      button,
      a {
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #b29262;
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      .shell {
        max-width: 1120px;
        margin: auto;
        padding: 24px clamp(18px, 4vw, 56px) 60px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }
      a {
        color: inherit;
      }
      .brand {
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 10px;
        letter-spacing: 2px;
        line-height: 1.4;
      }
      .mark {
        font:
          italic 38px Georgia,
          serif;
        letter-spacing: -5px;
        border: 1px solid #aab8a7;
        border-radius: 50%;
        padding: 4px 16px 9px 8px;
      }
      .quiet,
      button.secondary {
        border: 1px solid var(--line);
        border-radius: 30px;
        background: transparent;
        color: var(--ink);
        padding: 9px 20px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1fr 230px;
        align-items: center;
        gap: 30px;
        padding: 50px 0 34px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2.5px;
        color: var(--muted);
        margin: 0 0 18px;
      }
      h1 {
        font:
          normal clamp(36px, 5.5vw, 62px)/1.3 Georgia,
          "Songti SC",
          serif;
        letter-spacing: -1px;
        margin: 0 0 24px;
      }
      h2 {
        font:
          normal 30px/1.4 Georgia,
          "Songti SC",
          serif;
        margin: 10px 0 16px;
      }
      h3 {
        font-size: 20px;
        line-height: 1.5;
        margin: 0 0 7px;
      }
      .lede {
        max-width: 650px;
        color: var(--muted);
        margin: 0;
      }
      .sound-art {
        height: 230px;
        position: relative;
        border-radius: 120px 120px 25px 25px;
        overflow: hidden;
        background: linear-gradient(145deg, #254c3e, #8d9b76);
        display: grid;
        place-items: center;
      }
      .sound-art:before,
      .sound-art:after {
        content: "";
        position: absolute;
        border: 1px solid #e6e2bd66;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        transform: translateY(65px);
        box-shadow:
          0 0 0 20px #e6e2bd22,
          0 0 0 40px #e6e2bd22,
          0 0 0 60px #e6e2bd22;
      }
      .sound-art span {
        font: italic 27px Georgia;
        color: #f7f4ec;
        z-index: 1;
        text-align: center;
        line-height: 1.4;
      }
      .steps {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 28px;
      }
      .steps span {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .steps b {
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 50%;
        padding: 2px 8px;
      }
      .panel {
        padding: clamp(20px, 4vw, 36px);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #fffefa;
        margin-bottom: 20px;
      }
      .consent {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        font-size: 14px;
        color: var(--muted);
      }
      input[type="checkbox"] {
        margin-top: 7px;
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        accent-color: var(--ink);
      }
      .record-row {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        margin: 25px 0 18px;
      }
      .primary {
        border: 0;
        background: var(--ink);
        color: #fffefa;
        padding: 14px 24px;
        border-radius: 30px;
        min-height: 50px;
      }
      .recording {
        background: #9f5145 !important;
      }
      .status {
        color: var(--muted);
        font-size: 14px;
        min-height: 28px;
      }
      .status.error {
        color: #9f5145;
      }
      .small {
        font-size: 13px;
        color: var(--muted);
      }
      .upload-label {
        display: inline-block;
        text-decoration: underline;
        cursor: pointer;
        font-size: 14px;
      }
      input[type="file"] {
        max-width: 100%;
        font-size: 13px;
        margin: 6px 0 16px;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 12px;
        color: var(--muted);
        margin: 28px 0 14px;
      }
      .divider:after {
        content: "";
        height: 1px;
        background: var(--line);
        flex: 1;
      }
      textarea {
        width: 100%;
        resize: vertical;
        min-height: 140px;
        padding: 16px;
        border: 1px solid #b6c5b5;
        border-radius: 12px;
        color: var(--ink);
        background: #fff;
        line-height: 1.8;
      }
      .form-bottom {
        display: flex;
        gap: 14px;
        align-items: end;
        flex-wrap: wrap;
        margin-top: 17px;
      }
      .form-bottom label {
        flex: 1;
        min-width: 200px;
        font-size: 13px;
      }
      select {
        display: block;
        width: 100%;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--ink);
        background: #fff;
        margin-top: 6px;
      }
      .count {
        text-align: right;
        font-size: 12px;
        color: var(--muted);
      }
      .help {
        padding: 15px;
        background: #eef1e8;
        border-radius: 12px;
        margin: 15px 0;
      }
      .result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .result-card {
        padding: 24px 0;
        border-top: 1px solid var(--line);
      }
      .result-card p {
        margin: 8px 0;
      }
      .subtitle {
        color: var(--muted);
        font-size: 14px;
      }
      .version {
        display: block;
        margin: 10px 0;
        padding: 13px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        text-decoration: none;
        background: #f4f6ee;
      }
      .links {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        font-size: 14px;
      }
      summary {
        cursor: pointer;
      }
      footer {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        padding-top: 28px;
      }
      .notice {
        padding: 18px;
        background: #edf1e7;
        border-radius: 12px;
      }
      .preview {
        color: #8c633b;
        font-size: 12px;
      }
      @media (max-width: 650px) {
        .hero {
          grid-template-columns: 1fr;
          padding-top: 35px;
        }
        .sound-art {
          display: none;
        }
        .steps {
          gap: 10px;
          font-size: 12px;
        }
        .panel {
          border-radius: 16px;
        }
        .form-bottom > button {
          width: 100%;
        }
        .result-head {
          align-items: flex-start;
        }
        .shell {
          padding-top: 18px;
        }
        .brand {
          font-size: 9px;
          gap: 10px;
        }
        .quiet {
          padding: 8px 15px;
        }
      }
    </style>
    <style>
      .voice-studio {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(210px, 0.75fr);
        gap: 28px;
        margin: 24px 0;
        background: linear-gradient(125deg, #eef1e7, #fbf6e9);
        border: 1px solid #d6dfce;
        border-radius: 24px;
        padding: 28px;
      }
      .voice-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 15px;
        min-width: 0;
      }
      #micButton {
        width: 136px;
        height: 136px;
        border-radius: 50%;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 7px;
        background: radial-gradient(circle at 35% 25%, #52745c, #244b3e 70%);
        box-shadow:
          0 0 0 10px #c7d3ba55,
          0 0 0 22px #dbe1d044,
          0 14px 28px #244b3e22;
        position: relative;
      }
      #micButton svg {
        width: 37px;
        height: 37px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #mic-label {
        font-size: 14px;
        letter-spacing: 0.05em;
      }
      #micButton.recording {
        box-shadow:
          0 0 0 10px #b7786655,
          0 0 0 22px #ddbaaa44;
        background: #8d4f44;
      }
      #waveform {
        height: 44px;
        width: 100%;
        max-width: 280px;
        display: block;
      }
      .voice-guide h3 {
        font:
          normal 24px Georgia,
          "Songti SC",
          serif;
        margin: 0 0 12px;
      }
      .voice-guide ol {
        padding-left: 22px;
        margin: 0;
        color: #536859;
        font-size: 14px;
        line-height: 1.7;
      }
      .voice-guide li {
        margin: 9px 0;
      }
      .voice-guide .small {
        margin-bottom: 0;
      }
      .intake-fields {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        margin: 18px 0;
        background: #f8f8f0;
      }
      .intake-fields label {
        display: block;
        margin-bottom: 16px;
        font-size: 15px;
      }
      .intake-fields textarea {
        min-height: 85px;
        margin-top: 8px;
      }
      .context-note {
        padding: 12px 16px;
        border-radius: 12px;
        background: #f2f0e6;
        font-size: 13px;
        color: #596c5e;
      }
      .source-quote {
        border-left: 3px solid #b99b66;
        margin: 14px 0;
        padding: 10px 16px;
        background: #f4f5ee;
        color: #4b6253;
        font-size: 14px;
      }
      .source-quote p {
        margin: 0 0 7px;
      }
      .source-status {
        font-size: 12px;
        color: #617064;
        margin-top: 18px;
      }
      .result-card details {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 14px;
      }
      .result-card summary {
        cursor: pointer;
        font-size: 14px;
      }
      .result-card .testimonial {
        display: block;
        font-size: 14px;
        margin: 8px 0;
      }
      .safety-result {
        border-color: #b58d68;
        background: #fff9ee;
      }
      @media (max-width: 680px) {
        .voice-studio {
          grid-template-columns: 1fr;
          padding: 25px 20px;
          gap: 25px;
        }
        .voice-guide {
          order: 2;
        }
        .voice-controls {
          padding-top: 12px;
        }
        .voice-guide h3 {
          font-size: 22px;
        }
        #micButton {
          width: 120px;
          height: 120px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
    <script src="/assistant.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <a
          class="brand"
          href="https://frequencies-clinic.learnworlds.com/pages/home"
          target="_top"
          ><span class="mark">fc∿</span><span>FREQUENCIES<br />CLINIC</span></a
        ><button id="language" class="quiet" type="button">English</button>
      </header>
      <section class="hero">
        <div>
          <p class="eyebrow">YOUR VOICE. YOUR STARTING POINT.</p>
          <h1 id="title"></h1>
          <p id="intro" class="lede"></p>
        </div>
        <div class="sound-art" aria-hidden="true">
          <span>A little space.<br />A listening ear.</span>
        </div>
      </section>
      <div id="steps" class="steps"></div>
      <section class="panel" aria-labelledby="share-title">
        <h2 id="share-title"></h2>
        <div id="usage-note" class="context-note" role="status"></div>
        <label class="consent"
          ><input id="consent" type="checkbox" /><span id="consent-copy"></span
        ></label>
        <div class="voice-studio">
          <div class="voice-guide">
            <h3 id="guide-title"></h3>
            <ol id="guide-list"></ol>
            <p class="small" id="guide-note"></p>
          </div>
          <div class="voice-controls">
            <button
              id="micButton"
              class="primary"
              type="button"
              aria-pressed="false"
            >
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <rect x="11" y="3" width="10" height="17" rx="5"></rect>
                <path
                  d="M7 14v2a9 9 0 0 0 18 0v-2M16 25v5M11 30h10"
                ></path></svg
              ><span id="mic-label"></span></button
            ><button
              id="cancel-recording"
              class="secondary"
              type="button"
              hidden
            ></button
            ><canvas
              id="waveform"
              width="560"
              height="88"
              aria-hidden="true"
            ></canvas
            ><span id="record-note" class="small"></span>
          </div>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="mic-help" class="help" hidden>
          <p id="mic-help-copy"></p>
          <a id="open-direct" target="_blank" rel="noopener"></a>
        </div>
        <details>
          <summary id="upload-label"></summary>
          <p id="upload-copy" class="small"></p>
          <input
            id="audio-file"
            type="file"
            accept="audio/*,.webm,.m4a,.mp4,.mp3,.ogg,.wav,.flac"
          /><button id="upload-button" type="button" class="secondary"></button>
        </details>
        <div id="review-label" class="divider"></div>
        <form id="messageForm">
          <label id="input-label" for="messageInput"></label
          ><textarea id="messageInput" maxlength="2000" rows="4"></textarea>
          <div id="count" class="count">0 / 2000</div>
          <div class="form-bottom">
            <label
              ><span id="preference-label"></span
              ><select id="preference"></select></label
            ><button id="sendButton" class="primary" type="submit"></button>
          </div>
        </form>
        <p id="boundary" class="small"></p>
      </section>
      <section
        id="results"
        class="panel"
        hidden
        aria-labelledby="results-title"
      >
        <p class="eyebrow">YOUR FC LISTENING COMPANIONS</p>
        <div class="result-head">
          <h2 id="results-title" tabindex="-1"></h2>
          <button id="reset" class="quiet" type="button"></button>
        </div>
        <p id="results-message" class="notice"></p>
        <form id="intakeForm" class="intake-fields" hidden>
          <div id="intake-fields"></div>
          <button id="followupButton" class="primary" type="submit"></button>
        </form>
        <div id="membership-row">
          <label for="membership" id="membership-label"></label
          ><select id="membership"></select>
          <p id="access-note" class="small"></p>
        </div>
        <div id="recommendations"></div>
        <p id="results-boundary" class="small"></p>
        <p id="source-status" class="source-status"></p>
      </section>
      <footer id="footer"></footer>
    </main>
  </body>
</html>
