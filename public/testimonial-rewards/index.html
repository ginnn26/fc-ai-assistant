<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FC 会员积分</title><link rel="stylesheet" href="/testimonial-rewards/points.css"><script src="/testimonial-rewards/login.js" defer></script><script src="/testimonial-rewards/member.js" defer></script></head>
<body><main><header><a href="https://frequencies-clinic.learnworlds.com/start" id="home">← FC</a><span>FC</span><nav><button id="sign-out" hidden></button><button id="language">English</button></nav></header><section class="hero"><p id="eyebrow"></p><h1 id="title"></h1><p id="intro"></p><div class="tags" id="benefits"></div></section>
<p id="error" class="notice" role="status"></p>
<section id="login-panel" class="panel" hidden><h2 id="login-title"></h2><p id="login-copy"></p><form id="login-form"><label id="email-label" for="login-email"></label><input id="login-email" type="email" autocomplete="email" maxlength="254" required><button id="send-code" type="button"></button><label id="code-label" for="login-code"></label><input id="login-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required><label class="check"><input id="remember-login" type="checkbox"><span id="remember-label"></span></label><button id="verify-code" type="submit"></button><p id="login-status" role="status"></p></form></section>
<section id="account" hidden><div class="balance"><div><span id="available-label"></span><strong id="balance">—</strong></div><div><span id="held-label"></span><strong id="reserved">—</strong></div><button id="refresh"></button></div><p id="eligibility" class="notice"></p>
<section class="panel"><h2 id="claim-title"></h2><p id="claim-copy"></p><form id="claim-form"><label id="audio-label" for="audio-url"></label><input id="audio-url" type="url" maxlength="500" required><label id="reference-label" for="comment-ref"></label><input id="comment-ref" maxlength="500" minlength="3" required><p id="reference-help" class="small"></p><button id="submit-claim" type="submit"></button><p id="claim-status" role="status"></p></form></section>
<h2 id="gifts-title"></h2><p id="gifts-copy"></p><div id="catalogue" class="catalogue"></div>
<section id="redemption" class="panel" hidden><h2 id="redeem-title"></h2><form id="redeem-form"><p id="selected-reward"></p><label id="variant-label" for="variant"></label><select id="variant"></select><label id="delivery-label" for="delivery"></label><select id="delivery"></select><p id="shipping-info"></p><label class="check"><input id="agree" type="checkbox" required><span id="agree-label"></span></label><button id="request-reward" type="submit"></button><button id="close-redeem" type="button"></button><p id="redeem-status" role="status"></p></form></section>
<section class="panel"><h2 id="history-title"></h2><p id="history-copy"></p><h3 id="claims-title"></h3><div id="claims"></div><h3 id="orders-title"></h3><div id="orders"></div><h3 id="ledger-title"></h3><div id="ledger"></div></section></section>
<details class="panel"><summary id="poster-label"></summary><img id="poster" loading="lazy" alt=""></details><section class="panel"><h2 id="rules-title"></h2><ul id="rules"></ul><a id="contact" class="button" target="_blank" rel="noopener noreferrer"></a></section><footer id="footer"></footer></main></body></html>
